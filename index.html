<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Catcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>⭐ Star Catcher</h1>
    <p>Catch the stars. Miss three and the game ends!</p>

    <div class="scoreboard">
      <span>Score: <strong id="score">0</strong></span>
      <span>Lives: <strong id="lives">3</strong></span>
    </div>

    <canvas
      id="game"
      width="360"
      height="480"
      aria-label="Star Catcher game area"
    ></canvas>

    <div class="controls">
      <button id="left" type="button" aria-label="Move left">◀</button>
      <button id="start" type="button">Start Game</button>
      <button id="right" type="button" aria-label="Move right">▶</button>
    </div>

    <p id="message" role="status">
      Use the arrow keys or the left and right buttons.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
